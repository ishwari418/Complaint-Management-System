<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/auth.css"><title>Register · Complaint Management System</title></head><body class="auth"><main class="auth-card"><a class="brand" href="index.html"><img src="assets/images/logo.svg" alt="" width="34"><span>Complaint Management System</span></a><h2>Create your account</h2><form id="registerForm" novalidate>
<label class="lbl">Full name</label><input class="inp" name="name"><span class="fe" data-err="name"></span>
<label class="lbl">Email</label><input class="inp" name="email" type="email"><span class="fe" data-err="email"></span>
<label class="lbl">Phone number</label><input class="inp" name="phone" type="tel"><span class="fe" data-err="phone"></span>
<label class="lbl">Password</label><input class="inp" name="password" type="password" autocomplete="new-password"><span class="fe" data-err="password"></span>
<label class="lbl">Confirm password</label><input class="inp" name="confirm" type="password" autocomplete="new-password"><span class="fe" data-err="confirm"></span>
<p id="formMsg" class="msg" role="alert"></p><button class="btn" type="submit">Register</button></form><p class="alt-link">Already registered? <a class="link" href="login.html">Log in</a></p><p class="mut" style="font-size:.78rem">Public accounts always get the "user" role. Don't use a real password.</p></main><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script></body></html>
