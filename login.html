<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/auth.css"><title>Login · Complaint Management System</title></head><body class="auth"><main class="auth-card"><a class="brand" href="index.html"><img src="assets/images/logo.svg" alt="" width="34"><span>Complaint Management System</span></a><h2>Welcome back</h2><form id="loginForm" novalidate><label class="lbl">Email</label><input class="inp" name="email" type="email" autocomplete="username"><label class="lbl">Password</label><input class="inp" name="password" type="password" autocomplete="current-password"><p id="formMsg" class="msg" role="alert"></p><button class="btn" type="submit">Log in</button></form>
