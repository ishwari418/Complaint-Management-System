<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/images/logo.svg"><link rel="stylesheet" href="assets/css/style.css"><title>My Dashboard · Complaint Management System</title><link rel="stylesheet" href="assets/css/dashboard.css"></head><body><header class="topbar"><a class="brand" href="index.html"><img src="assets/images/logo.svg" alt=""><span>Complaint Management System</span></a><div class="top-right"><button id="bell" class="bell" title="Notifications"></button><span class="who"><b id="userName"></b><small id="userRole"></small></span><button id="logoutBtn" class="btn ghost sm">Log out</button></div></header><main class="container"><h1>My Dashboard</h1><nav class="tabs"><button class="tab" data-view="overview">Overview</button><button class="tab" data-view="new">New Complaint</button><button class="tab" data-view="notifications">Notifications</button><button class="tab" data-view="profile">Profile</button></nav>
<section class="view" id="view-overview"><div id="cards" class="cards"></div><div class="panel"><h2>My Complaints</h2><div id="complaintList"></div></div></section>
<section class="view" id="view-new"><div class="panel"><h2>Submit a Complaint</h2><form id="complaintForm" class="form-grid" novalidate><div class="full"><label class="lbl">Title</label><input class="inp" name="title" maxlength="120"></div><div><label class="lbl">Category</label><select class="inp" name="category"><option value="">Select…</option></select></div><div><label class="lbl">Priority</label><select class="inp" name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div class="full"><label class="lbl">Location</label><input class="inp" name="location" maxlength="120"></div><div class="full"><label class="lbl">Detailed description</label><textarea class="inp" name="description" rows="5" maxlength="2000"></textarea></div><div class="full"><label class="lbl">Attachment (optional)</label><input class="inp" type="file" name="attachment"><small class="mut">Only the file name is recorded. Files are not uploaded or stored (no backend).</small></div><div class="full"><p id="formMsg" class="msg" role="alert"></p><button class="btn" type="submit">Submit Complaint</button></div></form></div></section>
<section class="view" id="view-notifications"><div class="panel"><div class="row between"><h2>Notifications</h2><button id="markRead" class="btn ghost sm">Mark all as read</button></div><ul id="noteList"></ul></div></section>
<section class="view" id="view-profile"><div class="panel narrow"><h2>My Profile</h2><form id="profileForm"><label class="lbl">Full name</label><input class="inp" name="name"><label class="lbl">Email (cannot be changed)</label><input class="inp" name="email" disabled><label class="lbl">Phone</label><input class="inp" name="phone"><div class="row end"><button class="btn" type="submit">Save Changes</button></div></form></div></section></main><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/app.js"></script><script src="assets/js/user.js"></script></body></html>
